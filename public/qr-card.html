<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEP Registration Invite Cards — printable</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
  .setup { max-width: 560px; margin-bottom: 18px; }
  .setup input { width: 100%; font-size: 1rem; padding: 12px; border: 2px solid #d8dee6; border-radius: 10px; margin: 8px 0; }
  .setup button { font-size: 1rem; font-weight: 700; padding: 12px 18px; border: none; border-radius: 10px;
                  background: #b91c1c; color: #fff; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .cardp { border: 2px dashed #9aa4b2; border-radius: 12px; padding: 14px; display: flex; gap: 14px;
           align-items: center; break-inside: avoid; }
  .cardp img { width: 120px; height: 120px; }
  .cardp .t1 { font-weight: 900; font-size: .95rem; letter-spacing: .5px; }
  .cardp .t2 { font-size: .8rem; color: #333; margin-top: 4px; line-height: 1.35; }
  .cardp .t3 { font-size: .7rem; color: #7f1212; font-weight: 700; margin-top: 6px; letter-spacing: 1px; }
  @media print { .setup { display: none; } body { padding: 0; } }
</style>
</head>
<body>
<div class="setup">
  <h2>NEP Registration Invite Cards</h2>
  <p style="color:#5c6b7f;font-size:.9rem;margin-top:6px">Enter the NEP members-section registration
    link. This page renders printable hand-out cards (8 per page) — cut along the dashed lines. Hand one
    to every member the Help Table enrolls, and anyone flagged "no portal access."</p>
  <input type="text" id="url"
         value="https://district-of-columbia-firefighters-association-local-36.connectplus.app/register">
  <button onclick="make()">Make cards</button>
  <button onclick="window.print()" style="background:#1d4ed8">🖨 Print</button>
</div>
<div class="grid" id="grid"></div>
<script>
function make(){
  var url=document.getElementById('url').value.trim();
  if(!/^https?:\/\//.test(url)){ alert('Enter the full link (starts with https://)'); return; }
  localStorage.setItem('nep36qr', url);
  var qr='/qr.png?url='+encodeURIComponent(url);
  var card='<div class="cardp"><img src="'+qr+'">'+
    '<div><div class="t1">JOIN THE LOCAL 36 MEMBERS SECTION</div>'+
    '<div class="t2">Scan with your phone camera and register with a <b>personal email</b> '+
    '(not @dc.gov). Get contract updates, vote notices and member alerts.</div>'+
    '<div class="t3">DC FIRE FIGHTERS · IAFF LOCAL 36 · STRENGTH IN SOLIDARITY</div></div></div>';
  var html=''; for(var i=0;i<8;i++) html+=card;
  document.getElementById('grid').innerHTML=html;
}
var saved=localStorage.getItem('nep36qr');
if(saved) document.getElementById('url').value=saved;
make();
</script>
</body>
</html>
