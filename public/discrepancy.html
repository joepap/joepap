<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Local 36 — Help Table</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="appbar">
  <div class="brand">
    <img src="/logo.png" alt="" onerror="this.style.display='none'">
    <div class="org">
      <div class="l1">DC Fire Fighters &middot; Local 36</div>
      <div class="l2">Help Table &middot; Strength in Solidarity</div>
    </div>
  </div>
  <div class="spacer"></div>
  <a href="/admin.html" style="color:#fff;font-weight:700;text-decoration:none;margin-right:14px">Admin</a>
  <a href="/" style="color:#fff;font-weight:700;text-decoration:none;margin-right:14px">Check-in</a>
  <span class="station-chip" id="counts"></span>
</header>
<main>
  <section class="card" id="pinCard">
    <h3>Help Table PIN</h3>
    <div class="input-row">
      <input type="password" id="pin" placeholder="Staff password (same as check-in)" autocomplete="off">
      <button class="primary" id="unlock">Unlock</button>
    </div>
  </section>
  <div id="htRoot" class="hidden"></div>
</main>
<script src="/js/helptable.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pin = sessionStorage.getItem('disc36_pin') || '';
  var handle = null;
  function unlock() {
    pin = ($('pin').value.trim()) || pin;
    fetch('/api/discrepancy/list', { headers: { 'X-Admin-Pin': pin } }).then(function (r) {
      if (r.status !== 200) { alert(r.status === 0 ? 'No connection.' : 'Wrong PIN'); return; }
      sessionStorage.setItem('disc36_pin', pin);
      $('pinCard').classList.add('hidden');
      $('htRoot').classList.remove('hidden');
      handle = window.HelpTable.mount($('htRoot'), pin);
      handle.setCounter($('counts'));
    }).catch(function () { alert('No connection.'); });
  }
  $('unlock').onclick = unlock;
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
  if (pin) unlock();
})();
</script>
</body>
</html>
